# Chạy khi push/PR vào repo GitHub của BE (thư mục BE = root repo).
# Build từng service song song: compile + package (verify).

name: Backend CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - EurekaServer
          - CommonService
          - MessegeService
          - ApiGateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f ./mvnw ]; then chmod +x ./mvnw && ./mvnw -B verify; else mvn -B verify; fi

# CI — repo BE (root GitHub = thư mục BE).
# • Mỗi push/PR: build 4 module Maven (matrix).
# • CD (DigitalOcean, SSH, …): xem deploy.yml (workflow_dispatch hoặc nối sau job CI).
#
# Compose Kafka/Redis/Grafana nằm ở monorepo KIenTruc/ops/ (không nằm trong repo BE).

name: Backend CI

on:
  push:
    branches: [main, master, develop,dev/main]
  pull_request:
    branches: [main, master, develop,dev/main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - AuthService
          - SocialService
          - MessegeService
          - MediaService
          - ApiGateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f ./mvnw ]; then chmod +x ./mvnw && ./mvnw -B verify; else mvn -B verify; fi

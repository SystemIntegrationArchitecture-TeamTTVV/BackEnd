# ═══════════════════════════════════════════════════════════════════════════
# TTVV Social Network — Backend CD (Continuous Deployment)
# Tự động deploy lên server sau khi CI build xanh.
#
# Flow: CI xanh → SSH vào server → git pull → docker compose up
#
# Secrets cần thiết (GitHub → Settings → Secrets):
#   - SERVER_HOST:     IP/domain server (VD: 52.77.216.200)
#   - SERVER_USER:     SSH username (VD: ubuntu)
#   - SERVER_SSH_KEY:  SSH private key
# ═══════════════════════════════════════════════════════════════════════════

name: Backend CD

on:
  # Tự động chạy sau khi CI thành công
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main, master, develop, dev/main]

  # Hoặc trigger thủ công
  workflow_dispatch:
    inputs:
      environment:
        description: "Môi trường deploy (staging / production)"
        required: false
        default: "production"

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    # Chỉ deploy khi CI thành công (hoặc trigger thủ công)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🚀 Deploying TTVV Backend..."
            cd ~/BackEnd || exit 1

            echo "📥 Pulling latest code..."
            git pull origin ${{ github.event.workflow_run.head_branch || 'main' }}

            echo "🐳 Building & restarting services..."
            docker compose up -d --build --remove-orphans

            echo "⏳ Waiting for services to be healthy..."
            sleep 30

            echo "🩺 Health check..."
            docker compose ps

            echo "✅ Deploy complete!"

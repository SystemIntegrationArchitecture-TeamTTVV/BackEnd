# ═══════════════════════════════════════════════════════════════════════════
# TTVV Social Network — Docker Compose (All-in-One + Horizontal Scaling)
# Chạy toàn bộ hệ thống trong 1 lệnh duy nhất.
# Infra (Kafka, Redis, MongoDB, PostgreSQL) đã host remote — không cần container.
#
# Chạy:   docker compose up -d --build
# Scale:  docker compose up -d --scale common-service=3 --scale message-service=2
# Dừng:   docker compose down
# Logs:   docker compose logs -f <service-name>
# ═══════════════════════════════════════════════════════════════════════════

networks:
  ttvv:
    driver: bridge

services:

  # ─── Auth Service (PostgreSQL — Supabase remote) ──────────────────────
  auth-service:
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    restart: unless-stopped
    # Không fix port → cho phép scale nhiều instance
    expose:
      - "8083"
    env_file:
      - .env
    deploy:
      replicas: 1
    networks:
      - ttvv
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Social Service / CommonService (MongoDB — Atlas remote) ──────────
  common-service:
    build:
      context: ./SocialService
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
    ports:
      - "8081:8081"
    expose:
      - "8081"
    env_file:
      - .env
    deploy:
      replicas: 1
    environment:
      AUTH_SERVICE_BASE_URL: http://auth-service:8083
      MESSAGE_SERVICE_BASE_URL: http://message-service:8082
    networks:
      - ttvv
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Message Service (MongoDB — Atlas remote) ────────────────────────
  message-service:
    build:
      context: ./MessegeService
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
    expose:
      - "8082"
    env_file:
      - .env
    deploy:
      replicas: 1
    environment:
      COMMON_SERVICE_URL: http://common-service:8081
      AUTH_SERVICE_BASE_URL: http://auth-service:8083
    networks:
      - ttvv
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Media Service (MongoDB — Atlas remote) ────────────────────────
  media-service:
    build:
      context: ./MediaService
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
    expose:
      - "8084"
    env_file:
      - .env
    deploy:
      replicas: 1
    environment:
      COMMON_SERVICE_URL: http://common-service:8081
      AUTH_SERVICE_BASE_URL: http://auth-service:8083
    networks:
      - ttvv
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── API Gateway (Entry Point — Load Balancer) ────────────────────────
  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      COMMON_SERVICE_URL: http://common-service:8081
      MESSAGE_SERVICE_URL: http://message-service:8082
      MEDIA_SERVICE_URL: http://media-service:8084
      AUTH_SERVICE_URL: http://auth-service:8083
    depends_on:
      auth-service:
        condition: service_healthy
      common-service:
        condition: service_healthy
      message-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
    networks:
      - ttvv
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ═══════════════════════════════════════════════════════════════════════════
# TTVV Social Network — Docker Compose (All-in-One)
# Chạy toàn bộ 4 microservices trong 1 lệnh duy nhất.
# Infra (Kafka, Redis, MongoDB, PostgreSQL) đã host remote — không cần container.
#
# Chạy:   docker compose up -d --build
# Dừng:   docker compose down
# Logs:   docker compose logs -f <service-name>
# ═══════════════════════════════════════════════════════════════════════════

networks:
  ttvv:
    driver: bridge

services:

  # ─── Auth Service (PostgreSQL — Supabase remote) ──────────────────────
  auth-service:
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    networks:
      - ttvv
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Social Service / CommonService (MongoDB — Atlas remote) ──────────
  common-service:
    build:
      context: ./SocialService
      dockerfile: Dockerfile
    container_name: common-service
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      # Override URL nội bộ Docker (properties default trỏ remote, cần đổi sang Docker DNS)
      AUTH_SERVICE_BASE_URL: http://auth-service:8083
      MESSAGE_SERVICE_BASE_URL: http://message-service:8082
    networks:
      - ttvv
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Message Service (MongoDB — Atlas remote) ────────────────────────
  message-service:
    build:
      context: ./MessegeService
      dockerfile: Dockerfile
    container_name: message-service
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      # Override URL nội bộ Docker (properties default trỏ remote, cần đổi sang Docker DNS)
      COMMON_SERVICE_URL: http://common-service:8081
      AUTH_SERVICE_BASE_URL: http://auth-service:8083
    networks:
      - ttvv
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── API Gateway ──────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      # Override URL nội bộ Docker (Gateway cần biết 3 service downstream)
      COMMON_SERVICE_URL: http://common-service:8081
      MESSAGE_SERVICE_URL: http://message-service:8082
      AUTH_SERVICE_URL: http://auth-service:8083
    depends_on:
      auth-service:
        condition: service_healthy
      common-service:
        condition: service_healthy
      message-service:
        condition: service_healthy
    networks:
      - ttvv
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

spring:
  application:
    name: ApiGateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        # Swagger API Docs Routes
        - id: common-service-api-docs
          uri: lb://CommonService
          predicates:
            - Path=/api/common/v3/api-docs
          filters:
            - RewritePath=/api/common/v3/api-docs, /api-docs

        - id: message-service-api-docs
          uri: lb://MessegeService
          predicates:
            - Path=/api/message/v3/api-docs
          filters:
            - RewritePath=/api/message/v3/api-docs, /api-docs

        # CommonService Auth Routes
        - id: common-service-auth
          uri: lb://CommonService
          predicates:
            - Path=/api/common/auth/**
          filters:
            - RewritePath=/api/common/auth(/.*)?, /api/auth$1
            - name: CircuitBreaker
              args:
                name: commonService
                fallbackUri: forward:/fallback/common

        # CommonService WebSocket Route - Must be before common-service-all
        # WebSocket routes need to be explicitly configured
        - id: common-service-websocket
          uri: lb://CommonService
          predicates:
            - Path=/api/common/ws/**
          filters:
            - RewritePath=/api/common/ws(/.*)?, /ws$1

        # CommonService Routes
        - id: common-service-users
          uri: lb://CommonService
          predicates:
            - Path=/api/common/users/**
          filters:
            - RewritePath=/api/common/users(/.*)?, /api/users$1
            - name: CircuitBreaker
              args:
                name: commonService
                fallbackUri: forward:/fallback/common

        - id: common-service-posts
          uri: lb://CommonService
          predicates:
            - Path=/api/common/posts/**
          filters:
            - RewritePath=/api/common/posts(/.*)?, /api/posts$1
            - name: CircuitBreaker
              args:
                name: commonService
                fallbackUri: forward:/fallback/common

        - id: common-service-comments
          uri: lb://CommonService
          predicates:
            - Path=/api/common/comments/**
          filters:
            - RewritePath=/api/common/comments(/.*)?, /api/comments$1
            - name: CircuitBreaker
              args:
                name: commonService
                fallbackUri: forward:/fallback/common

        - id: common-service-groups
          uri: lb://CommonService
          predicates:
            - Path=/api/common/groups/**
          filters:
            - RewritePath=/api/common/groups(/.*)?, /api/groups$1
            - name: CircuitBreaker
              args:
                name: commonService
                fallbackUri: forward:/fallback/common

        - id: common-service-friends
          uri: lb://CommonService
          predicates:
            - Path=/api/common/friends/**
          filters:
            - RewritePath=/api/common/friends(/.*)?, /api/friends$1
            - name: CircuitBreaker
              args:
                name: commonService
                fallbackUri: forward:/fallback/common

        - id: common-service-reactions
          uri: lb://CommonService
          predicates:
            - Path=/api/common/reactions/**
          filters:
            - RewritePath=/api/common/reactions(/.*)?, /api/reactions$1
            - name: CircuitBreaker
              args:
                name: commonService
                fallbackUri: forward:/fallback/common

        - id: common-service-friend-requests
          uri: lb://CommonService
          predicates:
            - Path=/api/common/friend-requests/**
          filters:
            - RewritePath=/api/common/friend-requests(/.*)?, /api/friend-requests$1
            - name: CircuitBreaker
              args:
                name: commonService
                fallbackUri: forward:/fallback/common

        - id: common-service-notifications
          uri: lb://CommonService
          predicates:
            - Path=/api/common/notifications/**
          filters:
            - RewritePath=/api/common/notifications(/.*)?, /api/notifications$1
            - name: CircuitBreaker
              args:
                name: commonService
                fallbackUri: forward:/fallback/common

        - id: common-service-stories
          uri: lb://CommonService
          predicates:
            - Path=/api/common/stories/**
          filters:
            - RewritePath=/api/common/stories(/.*)?, /api/stories$1
            - name: CircuitBreaker
              args:
                name: commonService
                fallbackUri: forward:/fallback/common

        - id: common-service-ai
          uri: lb://CommonService
          predicates:
            - Path=/api/common/ai/**
          filters:
            - RewritePath=/api/common/ai(/.*)?, /api/ai$1
            - name: CircuitBreaker
              args:
                name: commonService
                fallbackUri: forward:/fallback/common

        - id: common-service-roles
          uri: lb://CommonService
          predicates:
            - Path=/api/common/roles/**
          filters:
            - RewritePath=/api/common/roles(/.*)?, /api/roles$1
            - name: CircuitBreaker
              args:
                name: commonService
                fallbackUri: forward:/fallback/common

        - id: common-service-files
          uri: lb://CommonService
          predicates:
            - Path=/api/common/api/files/**
          filters:
            - RewritePath=/api/common/api/files(/.*)?, /api/files$1
            - name: CircuitBreaker
              args:
                name: commonService
                fallbackUri: forward:/fallback/common

        - id: common-service-upload
          uri: lb://CommonService
          predicates:
            - Path=/api/common/api/upload/**
          filters:
            - RewritePath=/api/common/api/upload(/.*)?, /api/upload$1
            - name: CircuitBreaker
              args:
                name: commonService
                fallbackUri: forward:/fallback/common

        - id: common-service-reports
          uri: lb://CommonService
          predicates:
            - Path=/api/reports/**
          filters:
            - RewritePath=/api/reports(/.*)?, /api/reports$1
            - name: CircuitBreaker
              args:
                name: commonService
                fallbackUri: forward:/fallback/common

        - id: common-service-stats
          uri: lb://CommonService
          predicates:
            - Path=/api/stats/**
          filters:
            - RewritePath=/api/stats(/.*)?, /api/stats$1
            - name: CircuitBreaker
              args:
                name: commonService
                fallbackUri: forward:/fallback/common

        - id: common-service-all
          uri: lb://CommonService
          predicates:
            - Path=/api/common/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: commonService
                fallbackUri: forward:/fallback/common

        # MessegeService Routes
        - id: message-service-upload
          uri: lb://MessegeService
          predicates:
            - Path=/api/message/api/upload/**
          filters:
            - RewritePath=/api/message/api/upload(/.*)?, /api/upload$1
            - name: CircuitBreaker
              args:
                name: messageService
                fallbackUri: forward:/fallback/message

        - id: message-service-files
          uri: lb://MessegeService
          predicates:
            - Path=/api/message/api/files/**
          filters:
            - RewritePath=/api/message/api/files(/.*)?, /api/files$1
            - name: CircuitBreaker
              args:
                name: messageService
                fallbackUri: forward:/fallback/message

        - id: message-service-conversations
          uri: lb://MessegeService
          predicates:
            - Path=/api/message/conversations/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: messageService
                fallbackUri: forward:/fallback/message

        - id: message-service-messages
          uri: lb://MessegeService
          predicates:
            - Path=/api/message/messages/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: messageService
                fallbackUri: forward:/fallback/message

        - id: message-service-calls
          uri: lb://MessegeService
          predicates:
            - Path=/api/message/calls/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: messageService
                fallbackUri: forward:/fallback/message

        - id: message-service-all
          uri: lb://MessegeService
          predicates:
            - Path=/api/message/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: messageService
                fallbackUri: forward:/fallback/message

      # Global CORS Configuration
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOriginPatterns: "*" # Changed from allowedOrigins to allowedOriginPatterns
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

server:
  port: 8088

app:
  security:
    enabled: false

jwt:
  # Must match CommonService jwt.secret to validate tokens at the edge
  secret: mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      commonService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
      messageService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: INFO

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Common Service
        url: /api/common/v3/api-docs
      - name: Message Service
        url: /api/message/v3/api-docs
    urls-primary-name: Common Service

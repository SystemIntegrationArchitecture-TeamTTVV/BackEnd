                fallbackUri: forward:/fallback/message

        - id: message-service-all
          uri: ${MESSAGE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/message/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: messageService
                fallbackUri: forward:/fallback/message

      httpclient:
        connect-timeout: 10000
        response-timeout: 30s

      # ─── Global CORS ───────────────────────────────────────────────────────
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

server:
  port: 8088

app:
  security:
    enabled: false

jwt:
  secret: mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

resilience4j:
  timelimiter:
    instances:
      commonService:
        timeoutDuration: 30s
        cancelRunningFuture: true
      messageService:
        timeoutDuration: 30s
        cancelRunningFuture: true
  circuitbreaker:
    instances:
      commonService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 80
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
      messageService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 80
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: INFO

# Swagger
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Common Service
        url: /api/common/v3/api-docs
      - name: Message Service
        url: /api/message/v3/api-docs
    urls-primary-name: Common Service

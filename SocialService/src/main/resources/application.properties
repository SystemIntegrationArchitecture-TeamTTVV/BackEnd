spring.application.name=SocialService

# AI Gemini Configuration
# Khuyến nghị: set biến môi trường GEMINI_API_KEY và KHÔNG hardcode key trong source
# ⚠️ PRODUCTION: set GEMINI_API_KEY env var
ai.gemini.api-key=${GEMINI_API_KEY:AIzaSyD2dLflwSeH_-2jtBwpkmXse2VxE94-814}

# API key riêng cho kiểm duyệt vi phạm (để tách quota/token, tránh ảnh hưởng chức năng khác)
# ⚠️ PRODUCTION: set GEMINI_VIOLATION_API_KEY env var
ai.gemini.violation.api-key=${GEMINI_VIOLATION_API_KEY:AIzaSyDPFF2E7VFa2kJWAiQB1dqMMdpAd2RxqvU}

# Server Configuration
# Render sẽ set PORT env, local thì default 8081
server.port=${PORT:8081}

# Ensure we always return the exception message in error payload
# so frontend can display moderation violations to the user.
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# MongoDB Configuration

# ⚠️ PRODUCTION: set MONGODB_URI env var — do NOT use hardcoded credentials in production
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://admin:22102004@cluster0.fh2rx8k.mongodb.net/ttvv_common?retryWrites=true&w=majority&appName=Cluster0}
spring.data.mongodb.auto-index-creation=false

# Data Seeding Configuration
# Set to true to enable data seeding on startup
# Set to false to disable seeding (useful after first run)
app.data.seed.enabled=false

# Security Configuration
# Set to false to disable authentication completely (for development/testing)
# Set to true to enable authentication (for production)
# Note: When enabled, SwaggerBypassFilter allows Swagger UI requests to bypass authentication
#       while other requests still require JWT token
app.security.enabled=${APP_SECURITY_ENABLED:true}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Resend Email Configuration
# Get your API key from: https://resend.com/api-keys
# ⚠️ PRODUCTION: set RESEND_API_KEY env var
resend.api-key=${RESEND_API_KEY:re_7uQEVMLU_LecJvJThvfkRFNbuU9hAimP2}
resend.from-email=onboarding@resend.dev

# Application Base URL (for reset password links)
app.base-url=http://localhost:5173


# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Tomcat mặc định ~2MB cho POST — request multipart >2MB (ảnh story + avatar base64) sẽ 413 dù multipart đã 50MB
server.tomcat.max-http-form-post-size=52MB
server.tomcat.max-swallow-size=52MB
app.upload.dir=uploads

# Cloudinary — KHÔNG ghi secret vào repo. Dùng biến môi trường hoặc file .env local (đã .gitignore).
# Khi đủ 3 giá trị: upload avatar/post/chat/story lên Cloudinary, API trả về secure_url (HTTPS).
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# --- Redis: access + refresh token (TokenStoreService — đã nối AuthService.login/refresh) ---
# Redis Cloud subscription: database-MNMQ2UIL | public endpoint (TLS bắt buộc)
# Mật khẩu ACL đặt biến REDIS_PASSWORD (file .env hoặc IDE) — không commit mật khẩu.
app.token-store.enabled=${APP_TOKEN_STORE_ENABLED:true}

# Redis có thể trỏ về infra DigitalOcean (hoặc local) qua ENV.
# Ví dụ chạy BE local + infra DO:
#   REDIS_HOST=<DO_PUBLIC_IP>
#   REDIS_PORT=6379
#   REDIS_USERNAME=
#   REDIS_PASSWORD=
spring.data.redis.host=${REDIS_HOST:redis-12365.crce302.ap-seast-1-3.ec2.cloud.redislabs.com}
spring.data.redis.port=${REDIS_PORT:12365}
spring.data.redis.username=${REDIS_USERNAME:default}
# ⚠️ PRODUCTION: set REDIS_PASSWORD env var
spring.data.redis.password=${REDIS_PASSWORD:yYBhetVTlkw9HlcLoWxj4mf9RQu2NnJo}
spring.data.redis.database=0
spring.data.redis.ssl.enabled=false

# OpenFeign default configuration
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=5000
spring.cloud.openfeign.client.config.default.loggerLevel=basic

# JWT Token expiration (milliseconds)
# Access token: 30 minutes
jwt.access-token-expiration=1800000
# Refresh token: 30 days
jwt.refresh-token-expiration=2592000000

# ============================
# Resilience4j / Circuit Breaker
# ============================

# Circuit breaker for calls from CommonService -> MessageService (via Feign)
resilience4j.circuitbreaker.instances.messageService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.messageService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.messageService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.messageService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.messageService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.messageService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.messageService.permittedNumberOfCallsInHalfOpenState=3

# Circuit breaker for external AI service (Gemini)
resilience4j.circuitbreaker.instances.aiService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.aiService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.aiService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.aiService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.aiService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.aiService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.aiService.permittedNumberOfCallsInHalfOpenState=3

# ============================
# Resilience4j / Retry
# ============================
resilience4j.retry.instances.messageService.maxAttempts=3
resilience4j.retry.instances.messageService.waitDuration=200ms

resilience4j.retry.instances.aiService.maxAttempts=2
resilience4j.retry.instances.aiService.waitDuration=300ms

# ============================
# Resilience4j / RateLimiter
# ============================
resilience4j.ratelimiter.instances.messageService.limitForPeriod=50
resilience4j.ratelimiter.instances.messageService.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.messageService.timeoutDuration=0

resilience4j.ratelimiter.instances.aiService.limitForPeriod=10
resilience4j.ratelimiter.instances.aiService.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.aiService.timeoutDuration=0

# ============================
# Resilience4j / Bulkhead (semaphore)
# ============================
resilience4j.bulkhead.instances.messageService.maxConcurrentCalls=20
resilience4j.bulkhead.instances.messageService.maxWaitDuration=0

resilience4j.bulkhead.instances.aiService.maxConcurrentCalls=5
resilience4j.bulkhead.instances.aiService.maxWaitDuration=0

# ============================
# Resilience4j / TimeLimiter (async only)
# ============================
resilience4j.timelimiter.instances.aiService.timeoutDuration=3s
resilience4j.timelimiter.instances.aiService.cancelRunningFuture=true

# AuthService (PostgreSQL) — user / role / JWT (no Eureka; set public URL on Railway)
auth.service.base-url=${AUTH_SERVICE_BASE_URL:http://localhost:8083}

# ============================
# Kafka
# ============================
app.kafka.enabled=false
spring.kafka.listener.auto-startup=${app.kafka.enabled:false}
# Kafka có thể trỏ về infra DigitalOcean qua ENV.
# Ví dụ: KAFKA_BOOTSTRAP_SERVERS=<DO_PUBLIC_IP>:9092
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=commonservice
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ============================
# Actuator / Prometheus
# ============================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
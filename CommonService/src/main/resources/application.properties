spring.application.name=CommonService

# Server Configuration
server.port=8081

# MongoDB Configuration
spring.mongodb.uri=mongodb://localhost:27017/ttvv_common
spring.data.mongodb.auto-index-creation=true

# Data Seeding Configuration
# Set to true to enable data seeding on startup
# Set to false to disable seeding (useful after first run)
app.data.seed.enabled=false

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

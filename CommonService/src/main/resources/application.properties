spring.application.name=CommonService

# AI Gemini Configuration
# Khuyến nghị: set biến môi trường GEMINI_API_KEY và KHÔNG hardcode key trong source
ai.gemini.api-key=${GEMINI_API_KEY:AIzaSyAnllzwlRnBUoS4rr9d_JDruuEy6ouPfOs}

# Server Configuration
# Render sẽ set PORT env, local thì default 8081
server.port=${PORT:8081}

# MongoDB Configuration
# Dùng env MONGODB_URI để connect Atlas / Render
spring.data.mongodb.uri=mongodb+srv://admin:22102004@cluster0.fh2rx8k.mongodb.net/ttvv_common?retryWrites=true&w=majority&appName=Cluster0
spring.data.mongodb.auto-index-creation=false

# Data Seeding Configuration
# Set to true to enable data seeding on startup
# Set to false to disable seeding (useful after first run)
app.data.seed.enabled=false

# Security Configuration
# Set to false to disable authentication completely (for development/testing)
# Set to true to enable authentication (for production)
# Note: When enabled, SwaggerBypassFilter allows Swagger UI requests to bypass authentication
#       while other requests still require JWT token
app.security.enabled=false

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Resend Email Configuration
# Get your API key from: https://resend.com/api-keys
resend.api-key=re_7uQEVMLU_LecJvJThvfkRFNbuU9hAimP2
resend.from-email=onboarding@resend.dev

# Application Base URL (for reset password links)
app.base-url=http://localhost:5173


# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads

# Redis Configuration (for tokens, cache, etc.)
# Set to true ONLY when you have Redis running.
# When false, app vẫn chạy bình thường, chỉ là không dùng refresh token lưu trong Redis.
app.token-store.enabled=false
spring.data.redis.url=redis://default:9OIEBDM41OEiWo6TCBaKivdF7clqK7ha@redis-11279.c51.ap-southeast-2-1.ec2.cloud.redislabs.com:11279
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0

# OpenFeign default configuration
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=5000
spring.cloud.openfeign.client.config.default.loggerLevel=basic

# JWT Token expiration (milliseconds)
# Access token: 30 minutes
jwt.access-token-expiration=1800000
# Refresh token: 30 days
jwt.refresh-token-expiration=2592000000

# ============================
# Resilience4j / Circuit Breaker
# ============================

# Circuit breaker for calls from CommonService -> MessageService (via Feign)
resilience4j.circuitbreaker.instances.messageService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.messageService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.messageService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.messageService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.messageService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.messageService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.messageService.permittedNumberOfCallsInHalfOpenState=3

# Circuit breaker for external AI service (Gemini)
resilience4j.circuitbreaker.instances.aiService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.aiService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.aiService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.aiService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.aiService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.aiService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.aiService.permittedNumberOfCallsInHalfOpenState=3

# ============================
# Resilience4j / Retry
# ============================
resilience4j.retry.instances.messageService.maxAttempts=3
resilience4j.retry.instances.messageService.waitDuration=200ms

resilience4j.retry.instances.aiService.maxAttempts=2
resilience4j.retry.instances.aiService.waitDuration=300ms

# ============================
# Resilience4j / RateLimiter
# ============================
resilience4j.ratelimiter.instances.messageService.limitForPeriod=50
resilience4j.ratelimiter.instances.messageService.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.messageService.timeoutDuration=0

resilience4j.ratelimiter.instances.aiService.limitForPeriod=10
resilience4j.ratelimiter.instances.aiService.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.aiService.timeoutDuration=0

# ============================
# Resilience4j / Bulkhead (semaphore)
# ============================
resilience4j.bulkhead.instances.messageService.maxConcurrentCalls=20
resilience4j.bulkhead.instances.messageService.maxWaitDuration=0

resilience4j.bulkhead.instances.aiService.maxConcurrentCalls=5
resilience4j.bulkhead.instances.aiService.maxWaitDuration=0

# ============================
# Resilience4j / TimeLimiter (async only)
# ============================
resilience4j.timelimiter.instances.aiService.timeoutDuration=3s
resilience4j.timelimiter.instances.aiService.cancelRunningFuture=true

# ============================
# Eureka Client (Service Discovery)
# ============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ============================
# Kafka
# ============================
app.kafka.enabled=false
spring.kafka.listener.auto-startup=${app.kafka.enabled:false}
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=commonservice
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ============================
# Actuator / Prometheus
# ============================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
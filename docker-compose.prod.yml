# ═══════════════════════════════════════════════════════════════════════════
# TTVV Social Network — Production (Services Only)
# Chỉ chạy 4 microservices, KHÔNG kèm infra (Kafka/Redis đã chạy remote).
#
# Chạy:   docker compose -f docker-compose.prod.yml up -d --build
# Dừng:   docker compose -f docker-compose.prod.yml down
# Logs:   docker compose -f docker-compose.prod.yml logs -f <service-name>
# ═══════════════════════════════════════════════════════════════════════════

networks:
  ttvv:
    driver: bridge

services:

  # ─── Auth Service ──────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      # KHÔNG dùng profile docker → dùng config default (trỏ remote infra)
      JWT_SECRET: ${JWT_SECRET:-mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong}
      DB_URL: ${DB_URL:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      APP_KAFKA_ENABLED: ${APP_KAFKA_ENABLED:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
    networks:
      - ttvv
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ─── Social Service (CommonService) ────────────────────────────────────
  common-service:
    build:
      context: ./SocialService
      dockerfile: Dockerfile
    container_name: common-service
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong}
      MONGODB_URI: ${MONGODB_URI:-}
      APP_TOKEN_STORE_ENABLED: ${APP_TOKEN_STORE_ENABLED:-true}
      APP_KAFKA_ENABLED: ${APP_KAFKA_ENABLED:-true}
      # AI keys
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VIOLATION_API_KEY: ${GEMINI_VIOLATION_API_KEY:-}
      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      # AWS S3
      AWS_S3_ENABLED: ${AWS_S3_ENABLED:-true}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Resend Email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    networks:
      - ttvv
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ─── Message Service ──────────────────────────────────────────────────
  message-service:
    build:
      context: ./MessegeService
      dockerfile: Dockerfile
    container_name: message-service
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      JWT_SECRET: ${JWT_SECRET:-mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong}
      MONGODB_URI: ${MONGODB_URI:-}
      APP_KAFKA_ENABLED: ${APP_KAFKA_ENABLED:-true}
      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      # AWS S3
      AWS_S3_ENABLED: ${AWS_S3_ENABLED:-true}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # LiveKit
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # Gemini (moderation)
      GEMINI_VIOLATION_API_KEY: ${GEMINI_VIOLATION_API_KEY:-}
    networks:
      - ttvv
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ─── API Gateway ──────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      PORT: 8088
      JWT_SECRET: ${JWT_SECRET:-mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong}
      # Service URLs — Docker DNS (cùng network)
      COMMON_SERVICE_URL: http://common-service:8081
      MESSAGE_SERVICE_URL: http://message-service:8082
      AUTH_SERVICE_URL: http://auth-service:8083
    depends_on:
      auth-service:
        condition: service_healthy
      common-service:
        condition: service_healthy
      message-service:
        condition: service_healthy
    networks:
      - ttvv
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

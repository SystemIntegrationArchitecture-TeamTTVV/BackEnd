spring.application.name=MediaService

# Server Configuration
server.port=8084
server.max-http-request-header-size=32768

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://admin:22102004@cluster0.fh2rx8k.mongodb.net/ttvv_media?retryWrites=true&w=majority&appName=Cluster0}
spring.data.mongodb.auto-index-creation=true

# Data Seeding Configuration
app.data.seed.enabled=${APP_DATA_SEED_ENABLED:false}

# Security Configuration
app.security.enabled=${APP_SECURITY_ENABLED:true}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Inter-service URLs
common.service.url=${COMMON_SERVICE_URL:https://starfish-app-5lg32.ondigitalocean.app}
auth.service.base-url=${AUTH_SERVICE_BASE_URL:https://auth-service-ih7gp.ondigitalocean.app}

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# AWS S3
aws.s3.enabled=${AWS_S3_ENABLED:true}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:demo-thach-deptrai}
aws.s3.region=${AWS_S3_REGION:ap-southeast-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Redis — Pub/Sub for socket events
spring.data.redis.host=${REDIS_HOST:52.77.216.200}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:mypassword123}
spring.data.redis.database=0
spring.data.redis.timeout=3000

# OpenFeign
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=30000
spring.cloud.openfeign.client.config.default.loggerLevel=basic
spring.cloud.loadbalancer.enabled=false

# Resilience4j / Circuit Breaker
resilience4j.circuitbreaker.instances.commonService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.commonService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.commonService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.commonService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.commonService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.commonService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.commonService.permittedNumberOfCallsInHalfOpenState=3

# Resilience4j / Retry
resilience4j.retry.instances.commonService.maxAttempts=3
resilience4j.retry.instances.commonService.waitDuration=200ms

# Resilience4j / RateLimiter
resilience4j.ratelimiter.instances.commonService.limitForPeriod=50
resilience4j.ratelimiter.instances.commonService.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.commonService.timeoutDuration=0

# Resilience4j / Bulkhead
resilience4j.bulkhead.instances.commonService.maxConcurrentCalls=20
resilience4j.bulkhead.instances.commonService.maxWaitDuration=0

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always


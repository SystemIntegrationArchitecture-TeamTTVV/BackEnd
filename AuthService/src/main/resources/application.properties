spring.application.name=AuthService

server.port=${PORT:8083}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# --- PostgreSQL (Supabase) ---
# ⚠️ PRODUCTION: set DB_URL, DB_USER, DB_PASSWORD env vars
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DB_USER:postgres.pogzbnvnzuhmmadhkryl}
spring.datasource.password=${DB_PASSWORD:VoSJaMsFmV2PSx3j}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.security.enabled=false
app.data.seed.enabled=${APP_DATA_SEED_ENABLED:false}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ⚠️ PRODUCTION: set RESEND_API_KEY env var
resend.api-key=${RESEND_API_KEY:re_Vfmkp8XG_MQT8pNKPDqNAuVc1Cahewkxx}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
app.base-url=${APP_BASE_URL:http://localhost:5173}

jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:2592000000}

app.token-store.enabled=${APP_TOKEN_STORE_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}

app.kafka.enabled=${APP_KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.health.redis.enabled=false

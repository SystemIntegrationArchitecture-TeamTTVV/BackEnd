# ─── Docker profile ─────────────────────────────────────────────────────
# Activated when SPRING_PROFILES_ACTIVE=docker (set in Dockerfile / docker-compose)
# Overrides service URLs from localhost → Docker DNS container names.

# Redis (infra container)
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.username=
spring.data.redis.password=

# Kafka (infra container — internal listener)
spring.kafka.bootstrap-servers=kafka:29092

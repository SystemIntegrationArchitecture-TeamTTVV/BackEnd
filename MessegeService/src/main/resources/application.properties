spring.application.name=MessegeService
# Exclude Kafka auto-config when disabled — prevents KafkaAdmin from trying to connect to localhost:9092
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Server Configuration
server.port=8082
server.max-http-request-header-size=32768

# MongoDB Configuration
# ⚠️ PRODUCTION: set MONGODB_URI env var — do NOT use hardcoded credentials in production
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://admin:22102004@cluster0.fh2rx8k.mongodb.net/ttvv_messege?retryWrites=true&w=majority&appName=Cluster0}
spring.data.mongodb.auto-index-creation=true

# Data Seeding Configuration
# Set to true to enable data seeding on startup
# Set to false to disable seeding (useful after first run)
app.data.seed.enabled=false

# Security Configuration
# Set to false to disable authentication completely (for development/testing)
# Set to true to enable authentication (for production)
# Note: When enabled, SwaggerBypassFilter allows Swagger UI requests to bypass authentication
#       while other requests still require JWT token
app.security.enabled=${APP_SECURITY_ENABLED:true}
app.features.privacy-block-check.enabled=${APP_FEATURE_PRIVACY_BLOCK_CHECK_ENABLED:false}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# doi nay thanh true neu insert data



# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads

# Message recall policy (global unsend)
chat.message.recall-window-seconds=120

# Cloudinary — cùng cloud_name với CommonService; không commit secret.
# ⚠️ PRODUCTION: set CLOUDINARY_* env vars — do NOT use hardcoded secrets in production
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# AWS S3 (chat upload)
# Bucket requested: demo-thach-deptrai
aws.s3.enabled=${AWS_S3_ENABLED:true}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:demo-thach-deptrai}
aws.s3.region=${AWS_S3_REGION:ap-southeast-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# ============================
# AI Gemini Configuration
# ============================
ai.gemini.violation.api-key=${GEMINI_VIOLATION_API_KEY:}

# ============================
# Redis — Pub/Sub for socket events + caching
# ============================
spring.data.redis.host=${REDIS_HOST:54.255.247.158}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:MatKhauRatManh123}
spring.data.redis.database=0
spring.data.redis.timeout=3000

# OpenFeign default configuration
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=30000
spring.cloud.openfeign.client.config.default.loggerLevel=basic
# Disable Spring Cloud LoadBalancer — we use direct URLs, no service discovery
spring.cloud.loadbalancer.enabled=false

# ============================
# Resilience4j / Circuit Breaker
# ============================

# Circuit breaker for calls from MessegeService -> CommonService (via Feign)
resilience4j.circuitbreaker.instances.commonService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.commonService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.commonService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.commonService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.commonService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.commonService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.commonService.permittedNumberOfCallsInHalfOpenState=3

# ============================
# Resilience4j / Retry
# ============================
resilience4j.retry.instances.commonService.maxAttempts=3
resilience4j.retry.instances.commonService.waitDuration=200ms

# ============================
# Resilience4j / RateLimiter
# ============================
resilience4j.ratelimiter.instances.commonService.limitForPeriod=50
resilience4j.ratelimiter.instances.commonService.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.commonService.timeoutDuration=0

# ============================
# Resilience4j / Bulkhead (semaphore)
# ============================
resilience4j.bulkhead.instances.commonService.maxConcurrentCalls=20
resilience4j.bulkhead.instances.commonService.maxWaitDuration=0



# ============================
# Kafka
# ============================
app.kafka.enabled=true
spring.kafka.listener.auto-startup=${app.kafka.enabled:true}
# Prevent KafkaAdmin from connecting to broker when Kafka is disabled
spring.kafka.admin.auto-create=${app.kafka.enabled:true}
# Kafka có thể trỏ về infra DigitalOcean qua ENV.
# Ví dụ: KAFKA_BOOTSTRAP_SERVERS=<DO_PUBLIC_IP>:9092
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:47.129.159.249:9092}
spring.kafka.consumer.group-id=messegeservice
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=\
  edu.iuh.fit.se.commonservice.event.NotificationCreatedEvent:edu.iuh.fit.se.messegeservice.event.NotificationCreatedEvent,\
  edu.iuh.fit.se.authservice.event.UserRegisteredEvent:edu.iuh.fit.se.messegeservice.event.UserRegisteredEvent,\
  edu.iuh.fit.se.commonservice.event.FriendAcceptedEvent:edu.iuh.fit.se.messegeservice.event.FriendAcceptedEvent,\
  edu.iuh.fit.se.commonservice.event.PostCreatedEvent:edu.iuh.fit.se.messegeservice.event.PostCreatedEvent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ============================
# Actuator / Prometheus
# ============================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.health.redis.enabled=false
management.health.kafka.enabled=false


spring.application.name=MessegeService

# Server Configuration
server.port=8082

# MongoDB Configuration
spring.data.mongodb.uri=mongodb+srv://admin:22102004@cluster0.fh2rx8k.mongodb.net/ttvv_messege?retryWrites=true&w=majority&appName=Cluster0
spring.data.mongodb.auto-index-creation=true

# Data Seeding Configuration
# Set to true to enable data seeding on startup
# Set to false to disable seeding (useful after first run)
app.data.seed.enabled=false

# Security Configuration
# Set to false to disable authentication completely (for development/testing)
# Set to true to enable authentication (for production)
# Note: When enabled, SwaggerBypassFilter allows Swagger UI requests to bypass authentication
#       while other requests still require JWT token
app.security.enabled=false

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# doi nay thanh true neu insert data

# CommonService Configuration (for socket events)
common.service.url=http://localhost:8081

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads

# Cloudinary — cùng cloud_name với CommonService; không commit secret.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dwmyy5het}
cloudinary.api-key=${CLOUDINARY_API_KEY:649635472791366}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:zsVMH2-wMu3bXkhp6zVEtW7SmKk}

# OpenFeign default configuration
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=5000
spring.cloud.openfeign.client.config.default.loggerLevel=basic

# ============================
# Resilience4j / Circuit Breaker
# ============================

# Circuit breaker for calls from MessegeService -> CommonService (via Feign)
resilience4j.circuitbreaker.instances.commonService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.commonService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.commonService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.commonService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.commonService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.commonService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.commonService.permittedNumberOfCallsInHalfOpenState=3

# ============================
# Resilience4j / Retry
# ============================
resilience4j.retry.instances.commonService.maxAttempts=3
resilience4j.retry.instances.commonService.waitDuration=200ms

# ============================
# Resilience4j / RateLimiter
# ============================
resilience4j.ratelimiter.instances.commonService.limitForPeriod=50
resilience4j.ratelimiter.instances.commonService.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.commonService.timeoutDuration=0

# ============================
# Resilience4j / Bulkhead (semaphore)
# ============================
resilience4j.bulkhead.instances.commonService.maxConcurrentCalls=20
resilience4j.bulkhead.instances.commonService.maxWaitDuration=0

# ============================
# Eureka Client (Service Discovery)
# ============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ============================
# Kafka
# ============================
app.kafka.enabled=false
spring.kafka.listener.auto-startup=${app.kafka.enabled:false}
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=messegeservice
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ============================
# Actuator / Prometheus
# ============================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
